<svg xmlns="http://www.w3.org/2000/svg" width="950" height="256" viewBox="0 0 950 256" role="img" font-family="Helvetica, Arial, sans-serif"><title>Highest-to-lowest price ratio, median across procedures</title><desc>H2 estimates with 95% intervals; dashed line at the pre-registered threshold of 2</desc><rect width="950" height="256" fill="#fcfcfb"/><text x="16" y="24" font-size="15" font-weight="700" fill="#1d2a30">Highest-to-lowest price ratio, median across procedures</text><line x1="330.0" y1="38" x2="330.0" y2="196" stroke="#cfd8dc"/><text x="330.0" y="214" font-size="11" text-anchor="middle" fill="#5b6b73">1.00</text><line x1="414.0" y1="38" x2="414.0" y2="196" stroke="#cfd8dc"/><text x="414.0" y="214" font-size="11" text-anchor="middle" fill="#5b6b73">1.60</text><line x1="498.0" y1="38" x2="498.0" y2="196" stroke="#cfd8dc"/><text x="498.0" y="214" font-size="11" text-anchor="middle" fill="#5b6b73">2.20</text><line x1="582.0" y1="38" x2="582.0" y2="196" stroke="#cfd8dc"/><text x="582.0" y="214" font-size="11" text-anchor="middle" fill="#5b6b73">2.80</text><line x1="666.0" y1="38" x2="666.0" y2="196" stroke="#cfd8dc"/><text x="666.0" y="214" font-size="11" text-anchor="middle" fill="#5b6b73">3.40</text><line x1="750.0" y1="38" x2="750.0" y2="196" stroke="#cfd8dc"/><text x="750.0" y="214" font-size="11" text-anchor="middle" fill="#5b6b73">4.00</text><line x1="470.0" y1="34" x2="470.0" y2="196" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 4"/><text x="474.0" y="32" font-size="11" fill="#eb6834">2</text><text x="16" y="65.0" font-size="12" fill="#1d2a30">Pooled, both metros (pre-registered)</text><line x1="444.9" y1="61.0" x2="525.3" y2="61.0" stroke="#2a78d6" stroke-width="2.5"/><circle cx="459.1" cy="61.0" r="5" fill="#2a78d6"/><text x="762.0" y="65.0" font-size="11" text-anchor="start" fill="#5b6b73">1.92 (1.82-2.39)  n=99</text><text x="16" y="95.0" font-size="12" fill="#1d2a30">Phoenix</text><line x1="583.6" y1="91.0" x2="735.8" y2="91.0" stroke="#2a78d6" stroke-width="2.5"/><circle cx="583.7" cy="91.0" r="5" fill="#2a78d6"/><text x="762.0" y="95.0" font-size="11" text-anchor="start" fill="#5b6b73">2.81 (2.81-3.90)  n=50</text><text x="16" y="125.0" font-size="12" fill="#1d2a30">Tucson</text><line x1="365.1" y1="121.0" x2="434.0" y2="121.0" stroke="#2a78d6" stroke-width="2.5"/><circle cx="384.6" cy="121.0" r="5" fill="#2a78d6"/><text x="762.0" y="125.0" font-size="11" text-anchor="start" fill="#5b6b73">1.39 (1.25-1.74)  n=49</text><text x="16" y="155.0" font-size="12" fill="#1d2a30">Phoenix, Tucson-sized hospital sets</text><line x1="486.9" y1="151.0" x2="583.6" y2="151.0" stroke="#2a78d6" stroke-width="2.5"/><circle cx="544.0" cy="151.0" r="5" fill="#2a78d6"/><text x="762.0" y="155.0" font-size="11" text-anchor="start" fill="#5b6b73">2.53 (2.12-2.81)  1,000 draws</text><text x="16" y="185.0" font-size="12" fill="#1d2a30">Phoenix, Tucson's number of systems</text><line x1="395.5" y1="181.0" x2="449.7" y2="181.0" stroke="#2a78d6" stroke-width="2.5"/><circle cx="422.6" cy="181.0" r="5" fill="#2a78d6"/><text x="762.0" y="185.0" font-size="11" text-anchor="start" fill="#5b6b73">1.66 (1.47-1.86)  1,000 draws</text><text x="540.0" y="244" font-size="11" text-anchor="middle" fill="#5b6b73">median ratio (95% interval: bootstrap over procedures, or 2.5-97.5% of subsampling draws)</text></svg>